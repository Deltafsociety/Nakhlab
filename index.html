<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باشگاه نخلاب - پنل مدیریت</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font: Vazirmatn for Persian text -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        :root {
            font-family: 'Vazirmatn', 'Inter', sans-serif;
        }
        .tab-btn.active {
            background-color: #10b981; /* Emerald 500 */
            color: white;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.5), 0 2px 4px -2px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Main Application Container -->
    <div id="app" class="flex flex-col flex-grow items-center p-4 sm:p-8">
        <h1 class="text-4xl font-extrabold text-emerald-600 mb-6 border-b-4 border-emerald-400 pb-2">
            باشگاه نخلاب - پنل مدیریت
        </h1>

        <!-- Loading & Auth State -->
        <div id="loading-indicator" class="text-gray-500 my-10">در حال بارگذاری...</div>
        <div id="auth-warning" class="hidden text-red-500 font-bold p-4 bg-red-100 rounded-lg shadow-md">
            خطا در احراز هویت. لطفاً مطمئن شوید که به اینترنت متصل هستید یا دوباره تلاش کنید.
        </div>

        <!-- Main Content (Hidden until authenticated) -->
        <div id="main-content" class="hidden w-full max-w-6xl bg-white rounded-xl shadow-2xl p-4 sm:p-8">

            <!-- Tabs Navigation -->
            <div class="flex flex-wrap justify-center gap-2 mb-6 border-b pb-4">
                <button class="tab-btn active p-3 rounded-xl transition duration-200 text-gray-700 hover:bg-emerald-100" data-tab="resources">
                    ۱. مدیریت کالا و منابع
                </button>
                <button class="tab-btn p-3 rounded-xl transition duration-200 text-gray-700 hover:bg-emerald-100" data-tab="sales-reg">
                    ۲. ثبت فروش روزانه
                </button>
                <button class="tab-btn p-3 rounded-xl transition duration-200 text-gray-700 hover:bg-emerald-100" data-tab="sales-report">
                    ۳. گزارش مالی فروش
                </button>
                <button class="tab-btn p-3 rounded-xl transition duration-200 text-gray-700 hover:bg-emerald-100" data-tab="gym-men">
                    ۴. باشگاه آقایان (پرداختی‌ها)
                </button>
                <button class="tab-btn p-3 rounded-xl transition duration-200 text-gray-700 hover:bg-emerald-100" data-tab="gym-women">
                    ۵. باشگاه بانوان (پرداختی‌ها)
                </button>
            </div>

            <!-- Tab Content -->
            <div id="tab-content">
                <!-- Content will be injected here -->
            </div>

            <!-- Global Message/Error Box -->
            <div id="message-box" class="mt-6 p-3 rounded-lg text-center font-bold transition-opacity duration-300 opacity-0 hidden"></div>
        </div>
        
        <!-- User ID for Debugging/Reference (MANDATORY) -->
        <p class="text-xs text-gray-400 mt-4">
            شناسه کاربری: <span id="user-id">...</span>
        </p>

    </div>

    <!-- Firebase Imports and Main Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // --- Date Helper (Gregorian/Miladi) ---

        // Helper to get current date in Gregorian ISO format (YYYY-MM-DD)
        function getCurrentGregorianDate() {
            return new Date().toISOString().substring(0, 10);
        }
        
        // Helper to get Gregorian date 30 days ago (for report defaults)
        function getDate30DaysAgo() {
            const date = new Date();
            date.setDate(date.getDate() - 30);
            return date.toISOString().substring(0, 10);
        }
        
        // setLogLevel('Debug'); // Uncomment for debugging Firebase

        // -------------------------------------------------------------------
        // !!! قدم حیاتی برای دیپلوی خارج از Canvas !!!
        // شما باید مقادیر YOUR_..._HERE را با تنظیمات Firebase خود جایگزین کنید.
        // این تنظیمات را می‌توانید از کنسول Firebase خود (تنظیمات پروژه > عمومی) دریافت کنید.
        // -------------------------------------------------------------------

        const appId = 'nakhlab-app-prod'; // شناسه ثابت برای استقرار.
        
        const firebaseConfig = {
            apiKey: "AIzaSyAiKvN6Ii1KhTlqHwVKCWILWdL878QW3h0", 
            authDomain: "nakhlab-ec4b3.firebaseapp.com",
            projectId: "nakhlab-ec4b3",
            storageBucket: "nakhlab-ec4b3.firebasestorage.app",
            messagingSenderId: "261714770697",
            appId: "1:261714770697:web:898936f8e5d3ab345d31d8"
        };

        // متغیرهای زیر دیگر از محیط Canvas تزریق نمی شوند و حذف شده اند.
        // const initialAuthToken = null; 

        let db, auth, userId;
        const LOADING_INDICATOR = document.getElementById('loading-indicator');
        const MAIN_CONTENT = document.getElementById('main-content');
        const AUTH_WARNING = document.getElementById('auth-warning');
        const USER_ID_SPAN = document.getElementById('user-id');
        const TAB_CONTENT = document.getElementById('tab-content');
        const MESSAGE_BOX = document.getElementById('message-box');

        // Helper: Display floating message
        function displayMessage(message, isError = false) {
            MESSAGE_BOX.textContent = message;
            MESSAGE_BOX.className = isError 
                ? 'mt-6 p-3 rounded-lg text-center font-bold opacity-100 block bg-red-100 text-red-700 shadow-md'
                : 'mt-6 p-3 rounded-lg text-center font-bold opacity-100 block bg-green-100 text-green-700 shadow-md';
            
            MESSAGE_BOX.style.opacity = '1';
            MESSAGE_BOX.style.display = 'block';

            setTimeout(() => {
                MESSAGE_BOX.style.opacity = '0';
                MESSAGE_BOX.ontransitionend = () => {
                    MESSAGE_BOX.style.display = 'none';
                };
            }, 3000);
        }

        // Helper: Format number to currency (Toman)
        function formatCurrency(number) {
            if (number === undefined || number === null) return "۰ تومان";
            // Use 'fa-IR' locale for Persian number formatting
            return new Intl.NumberFormat('fa-IR').format(Math.round(number)) + " تومان";
        }
        
        // Helper: Get Firestore path for a collection (private user data)
        function getCollectionPath(collectionName) {
            // از appId ثابت جدید و userId برای مسیر Firestore استفاده می شود.
            return `artifacts/${appId}/users/${userId}/${collectionName}`;
        }

        // --- Firebase Initialization and Authentication ---

        async function initFirebase() {
            try {
                // اگر تنظیمات اولیه خالی باشد، فایربیس شروع به کار نمی کند.
                if (!firebaseConfig.apiKey || firebaseConfig.apiKey.includes('YOUR_')) {
                    throw new Error("لطفاً تنظیمات Firebase را در کد جایگزین کنید.");
                }

                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // در محیط دیپلوی شده، به جای توکن اولیه، به صورت Anonymous وارد می شویم
                // تا دسترسی به داده های Firestore بر اساس قوانین امنیتی (Security Rules) فراهم شود.
                const userCredential = await signInAnonymously(auth);
                userId = userCredential.user.uid;
                USER_ID_SPAN.textContent = userId;
                
                LOADING_INDICATOR.classList.add('hidden');
                MAIN_CONTENT.classList.remove('hidden');
                
                // Start listeners for all data
                setupListeners();
                
                // Show default tab
                switchTab('resources');

            } catch (error) {
                console.error("Firebase Initialization Error:", error);
                // اگر خطا به دلیل تنظیمات نادرست باشد، پیام دقیق تر نمایش داده می شود.
                const errorMessage = error.message.includes('YOUR_') 
                    ? "خطا در احراز هویت: لطفاً تنظیمات Firebase را در فایل index.html جایگزین کنید."
                    : "خطا در احراز هویت. لطفاً مطمئن شوید که به اینترنت متصل هستید یا دوباره تلاش کنید.";

                AUTH_WARNING.textContent = errorMessage;
                LOADING_INDICATOR.classList.add('hidden');
                AUTH_WARNING.classList.remove('hidden');
            }
        }

        // --- Data Listeners & State Management ---

        let products = [];
        let sales = [];
        let trainers = [];
        let paymentsMen = [];
        let paymentsWomen = [];

        function setupListeners() {
            if (!userId || !db) return;

            // 1. Products Listener
            onSnapshot(collection(db, getCollectionPath('products')), (snapshot) => {
                // Attach selling price and cost to each product for easy access during sales calculation
                products = snapshot.docs.map(doc => {
                    const data = doc.data();
                    const sellingPrice = data.costPrice * (1 + data.profitMarginPercent / 100);
                    return { id: doc.id, ...data, sellingPrice: sellingPrice, costPrice: data.costPrice };
                }).filter(p => !p.deleted);
                renderResourceTab(); // Re-render if current tab
                renderSalesRegTab(); // Re-render to update product options if applicable
            });

            // 2. Sales Listener
            onSnapshot(collection(db, getCollectionPath('sales')), (snapshot) => {
                sales = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderSalesList(); // Update the list view (if tab is active)
            });

            // 3. Trainers Listener
            onSnapshot(collection(db, getCollectionPath('trainers')), (snapshot) => {
                trainers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(t => !t.deleted);
                // Re-render relevant tabs
                renderGymTab('men');
                renderGymTab('women');
            });

            // 4. Payments Men Listener
            onSnapshot(collection(db, getCollectionPath('payments_men')), (snapshot) => {
                paymentsMen = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderGymPaymentsList('payments_men');
            });

            // 5. Payments Women Listener
            onSnapshot(collection(db, getCollectionPath('payments_women')), (snapshot) => {
                paymentsWomen = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderGymPaymentsList('payments_women');
            });
        }

        // --- UI & Rendering Functions ---
        
        function switchTab(tabId) {
            // Hide all tab content
            TAB_CONTENT.innerHTML = '';
            
            // Deactivate all buttons and activate the current one
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tabId}"]`)?.classList.add('active');

            if (tabId === 'resources') renderResourceTab();
            else if (tabId === 'sales-reg') renderSalesRegTab();
            else if (tabId === 'sales-report') renderSalesReportTab();
            else if (tabId === 'gym-men') renderGymTab('men');
            else if (tabId === 'gym-women') renderGymTab('women');
        }

        // --- Tab Content Renderers ---

        function renderResourceTab() {
            const isCurrent = document.querySelector('.tab-btn.active')?.dataset.tab === 'resources';
            if (!isCurrent) return; 

            // 1. Product List Display (Showing all products)
            const productListHTML = `
                <div class="space-y-6">
                    <h2 class="text-2xl font-bold text-gray-800 border-b pb-2">لیست کامل کالاها</h2>
                    ${products.length === 0 
                        ? '<p class="text-gray-500">هیچ کالایی ثبت نشده است.</p>' 
                        : `<div class="overflow-x-auto">
                            <table class="min-w-full bg-white rounded-lg shadow-md">
                                <thead class="bg-emerald-500 text-white">
                                    <tr>
                                        <th class="py-3 px-4 text-right">نام کالا</th>
                                        <th class="py-3 px-4 text-right">قیمت خرید (تومان)</th>
                                        <th class="py-3 px-4 text-right">سود (%)</th>
                                        <th class="py-3 px-4 text-right">قیمت فروش</th>
                                        <th class="py-3 px-4 text-center">عملیات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${products.map(p => {
                                        // sellingPrice is already attached to product object in listener
                                        return `
                                            <tr class="border-b hover:bg-gray-50">
                                                <td class="py-3 px-4">${p.name}</td>
                                                <td class="py-3 px-4">${formatCurrency(p.costPrice)}</td>
                                                <td class="py-3 px-4">${p.profitMarginPercent}%</td>
                                                <td class="py-3 px-4 font-bold text-emerald-600">${formatCurrency(p.sellingPrice)}</td>
                                                <td class="py-3 px-4 text-center">
                                                    <button onclick="window.deleteProduct('${p.id}', '${p.name}')" class="text-red-500 hover:text-red-700 text-sm">حذف</button>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>`
                    }
                    
                    <h2 class="text-2xl font-bold text-gray-800 border-b pb-2 pt-4">افزودن کالای جدید</h2>
                    <form id="add-product-form" class="bg-gray-100 p-6 rounded-xl shadow-inner space-y-4">
                        <input type="text" id="product-name" placeholder="نام کالا" class="w-full p-3 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required>
                        <input type="number" id="cost-price" placeholder="قیمت خرید (تومان)" class="w-full p-3 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required min="0">
                        <input type="number" id="profit-margin" placeholder="درصد سود مورد نظر (مثلاً: 20)" class="w-full p-3 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required min="0">
                        <button type="submit" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-semibold hover:bg-emerald-700 transition duration-200 shadow-lg">
                            ثبت کالا
                        </button>
                    </form>
                </div>
            `;
            TAB_CONTENT.innerHTML = productListHTML;

            document.getElementById('add-product-form')?.addEventListener('submit', handleAddProduct);
        }
        
        window.deleteProduct = async function(productId, productName) {
            if (confirm(`آیا مطمئن هستید که می‌خواهید کالای "${productName}" را حذف کنید؟`)) {
                 try {
                    // Soft delete by setting a flag
                    await setDoc(doc(db, getCollectionPath('products'), productId), {deleted: true}, { merge: true });
                    displayMessage(`کالای "${productName}" حذف شد.`);
                 } catch (e) {
                    console.error("Error deleting document: ", e);
                    displayMessage("خطا در حذف کالا.", true);
                 }
            }
        }

        async function handleAddProduct(event) {
            event.preventDefault();
            const name = document.getElementById('product-name').value.trim();
            const costPrice = parseFloat(document.getElementById('cost-price').value);
            const profitMarginPercent = parseFloat(document.getElementById('profit-margin').value);

            if (!name || isNaN(costPrice) || isNaN(profitMarginPercent) || costPrice < 0 || profitMarginPercent < 0) {
                return displayMessage("لطفا تمام فیلدها را به درستی پر کنید.", true);
            }

            const newProduct = {
                name: name,
                costPrice: costPrice,
                profitMarginPercent: profitMarginPercent,
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, getCollectionPath('products')), newProduct);
                document.getElementById('add-product-form').reset();
                displayMessage(`کالای "${name}" با موفقیت ثبت شد.`);
            } catch (e) {
                console.error("Error adding document: ", e);
                displayMessage("خطا در ثبت کالا.", true);
            }
        }
        

        function renderSalesRegTab() {
            const isCurrent = document.querySelector('.tab-btn.active')?.dataset.tab === 'sales-reg';
            if (!isCurrent) return;

            // Prepare product options for the sales form
            const productOptions = products
                .filter(p => p.sellingPrice > 0) 
                .map(p => {
                    // Selling price is pre-calculated in the listener
                    return `<option value="${p.id}" data-price="${p.sellingPrice}" data-cost="${p.costPrice}">${p.name} (${formatCurrency(p.sellingPrice)})</option>`;
                }).join('');

            const salesRegHTML = `
                <div class="space-y-6">
                    <h2 class="text-2xl font-bold text-gray-800 border-b pb-2">ثبت فروش روزانه</h2>
                    <form id="sales-reg-form" class="bg-gray-100 p-6 rounded-xl shadow-inner space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- Date Input is now type="date" (Gregorian YYYY-MM-DD) -->
                            <input type="date" id="sale-date" placeholder="تاریخ فروش (YYYY-MM-DD)" class="w-full p-3 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required value="${getCurrentGregorianDate()}">
                            <input type="number" id="commission-percent" placeholder="پورسانت فروشنده از سود (%) (مثلاً: 5)" value="5" class="w-full p-3 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500" required min="0">
                            <select id="payment-method" class="w-full p-3 border rounded-lg focus:ring-emerald-500 focus:border-emerald-500">
                                <option value="نقدی">نقدی</option>
                                <option value="کارتخوان">کارتخوان</option>
                                <option value="چک">چک</option>
                                <option value="آنلاین">آنلاین</option>
                            </select>
                        </div>
                        
                        <h3 class="text-xl font-semibold pt-2">اقلام فروخته شده</h3>
                        <div id="items-list" class="space-y-3">
                            <!-- Items will be added here -->
                        </div>
                        <button type="button" id="add-item-btn" class="text-emerald-600 hover:text-emerald-700 font-bold border-2 border-emerald-600 rounded-lg p-2 transition duration-200">
                            + افزودن کالا به فروش
                        </button>

                        <div id="summary" class="bg-emerald-50 p-4 rounded-lg mt-4 font-bold">
                            <p>مجموع کل فروش: <span id="total-sale">۰ تومان</span></p>
                            <p>سود ناخالص: <span id="total-profit">۰ تومان</span></p>
                            <p>پورسانت فروشنده: <span id="salesman-commission">۰ تومان</span></p>
                            <p class="text-lg text-emerald-700">سود خالص نهایی: <span id="final-profit">۰ تومان</span></p>
                        </div>

                        <button type="submit" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-semibold hover:bg-emerald-700 transition duration-200 shadow-lg">
                            ثبت نهایی فروش
                        </button>
                    </form>
                    
                    <h2 class="text-2xl font-bold text-gray-800 border-b pb-2 pt-4">لیست کامل فروش‌های ثبت شده</h2>
                    <div id="sales-list-view">
                        <!-- Full Sales List will be rendered here -->
                    </div>
                </div>
            `;
            TAB_CONTENT.innerHTML = salesRegHTML;
            
            // Setup dynamic elements
            const salesRegForm = document.getElementById('sales-reg-form');
            const addItemBtn = document.getElementById('add-item-btn');
            const itemsListDiv = document.getElementById('items-list');
            const commissionInput = document.getElementById('commission-percent');

            let itemCounter = 0;
            // This array holds the current state of items in the form
            let addedItems = [];
            
            // Function to update the summary every time an item is added or quantity/percent changes
            function updateSummary() {
                let totalSale = 0;
                let totalCost = 0;
                const commissionPercent = parseFloat(commissionInput.value) || 0;

                addedItems.forEach(item => {
                    const quantity = parseFloat(document.getElementById(`quantity-${item.id}`)?.value) || 0;
                    totalSale += item.price * quantity;
                    totalCost += item.cost * quantity;
                });

                const totalProfit = totalSale - totalCost;
                // COMMISSION IS CALCULATED FROM GROSS PROFIT
                const salesmanCommission = totalProfit * (commissionPercent / 100);
                const finalProfit = totalProfit - salesmanCommission;

                document.getElementById('total-sale').textContent = formatCurrency(totalSale);
                document.getElementById('total-profit').textContent = formatCurrency(totalProfit);
                document.getElementById('salesman-commission').textContent = formatCurrency(salesmanCommission);
                document.getElementById('final-profit').textContent = formatCurrency(finalProfit);
            }

            // Function to add a single item row to the form
            function addItemRow() {
                if (products.length === 0) {
                    return displayMessage("لطفاً ابتدا کالا ثبت کنید.", true);
                }
                
                const currentId = itemCounter++;
                const itemRow = document.createElement('div');
                itemRow.id = `item-row-${currentId}`;
                itemRow.className = 'grid grid-cols-1 sm:grid-cols-5 gap-3 p-3 bg-white border rounded-lg';
                
                itemRow.innerHTML = `
                    <div class="sm:col-span-3">
                        <select id="product-select-${currentId}" class="w-full p-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                            ${productOptions}
                        </select>
                    </div>
                    <input type="number" id="quantity-${currentId}" placeholder="تعداد" value="1" min="1" class="w-full p-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    <button type="button" class="remove-item-btn bg-red-500 text-white p-2 rounded-lg hover:bg-red-600 transition duration-200">حذف</button>
                `;
                
                itemsListDiv.appendChild(itemRow);
                
                // Add to internal list and setup listeners
                const productSelect = document.getElementById(`product-select-${currentId}`);
                const quantityInput = document.getElementById(`quantity-${currentId}`);
                
                const selectedProduct = products.find(p => p.id === productSelect.value);
                
                // Add initial item data to the internal state
                if (selectedProduct) {
                    addedItems.push({ 
                        id: currentId, 
                        productId: selectedProduct.id, 
                        price: selectedProduct.sellingPrice, 
                        cost: selectedProduct.costPrice 
                    });
                }

                productSelect.onchange = () => {
                    const newProduct = products.find(p => p.id === productSelect.value);
                    const index = addedItems.findIndex(item => item.id === currentId);
                    if (index !== -1 && newProduct) {
                        addedItems[index].productId = newProduct.id;
                        // Use pre-calculated values from products array
                        addedItems[index].price = newProduct.sellingPrice; 
                        addedItems[index].cost = newProduct.costPrice;
                    }
                    updateSummary();
                };
                
                quantityInput.oninput = updateSummary;
                commissionInput.oninput = updateSummary; // Listen to commission changes
                
                // Handle removal
                itemRow.querySelector('.remove-item-btn').onclick = () => {
                    itemRow.remove();
                    const index = addedItems.findIndex(item => item.id === currentId);
                    if (index !== -1) {
                        addedItems.splice(index, 1);
                    }
                    updateSummary();
                };

                updateSummary();
            }

            addItemBtn.onclick = addItemRow;
            salesRegForm.onsubmit = handleSalesReg;
            
            // Add initial item row if products exist
            if (products.length > 0) addItemRow();
            
            renderSalesList(); // Render list of past sales
        }
        
        // Renders the full list of past sales
        function renderSalesList() {
             const salesListView = document.getElementById('sales-list-view');
             if (!salesListView) return; 
             
             // Sort sales by Gregorian date descending (stored in ISO format)
             const sortedSales = [...sales].sort((a, b) => new Date(b.date) - new Date(a.date));

        async function handleSalesReg(event) {
            event.preventDefault();

            const saleDate = document.getElementById('sale-date').value; // Now in YYYY-MM-DD format
            const commissionPercent = parseFloat(document.getElementById('commission-percent').value);
            const paymentMethod = document.getElementById('payment-method').value;
            const itemsListDiv = document.getElementById('items-list');
            
            if (!saleDate || isNaN(commissionPercent) || commissionPercent < 0 || itemsListDiv.children.length === 0) {
                return displayMessage("لطفا تمام اطلاعات فروش و حداقل یک کالا را به درستی وارد کنید.", true);
            }

            let totalSale = 0;
            let totalCost = 0;
            const itemsSold = [];

            for (const itemRow of itemsListDiv.children) {
                const id = itemRow.id.split('-')[2];
                const productSelect = document.getElementById(`product-select-${id}`);
                const quantityInput = document.getElementById(`quantity-${id}`);

                const productId = productSelect.value;
                // Find the product data from the globally loaded products array
                const product = products.find(p => p.id === productId);
                const quantity = parseInt(quantityInput.value);

                if (product && quantity > 0) {
                    const price = product.sellingPrice; // Pre-calculated selling price
                    const cost = product.costPrice;
                    
                    totalSale += price * quantity;
                    totalCost += cost * quantity;

                    itemsSold.push({
                        productId: productId,
                        name: product.name,
                        price: price, // Selling price
                        cost: cost,
                        quantity: quantity
                    });
                }
            }
            
            if (itemsSold.length === 0) {
                 return displayMessage("هیچ کالای معتبری با تعداد مثبت وارد نشده است.", true);
            }

            // Final Calculations:
            const totalProfit = totalSale - totalCost;
            const salesmanCommission = totalProfit * (commissionPercent / 100);
            const finalProfit = totalProfit - salesmanCommission;

            const saleData = {
                date: saleDate, // Stored in Gregorian ISO
                paymentMethod: paymentMethod,
                salesmanCommissionPercent: commissionPercent,
                itemsSold: itemsSold,
                totalSale: totalSale,
                dailyProfit: totalProfit, // Gross Profit
                salesmanCommission: salesmanCommission,
                finalProfit: finalProfit, // Net Profit
                timestamp: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, getCollectionPath('sales')), saleData);
                document.getElementById('sales-reg-form').reset();
                document.getElementById('items-list').innerHTML = '';
                // Re-add one item row after reset
                document.getElementById('add-item-btn').click(); 
                
                displayMessage(`فروش با موفقیت ثبت شد. سود خالص: ${formatCurrency(finalProfit)}`);
            } catch (e) {
                console.error("Error adding sale: ", e);
                displayMessage("خطا در ثبت فروش.", true);
            }
        }

            const trainerId = document.getElementById('trainer-select').value;
            const selectedTrainer = trainers.find(t => t.id === trainerId);

            if (!paymentDate) {
                return displayMessage("لطفا تاریخ پرداخت را وارد کنید.", true);
            }
            if (!memberName || isNaN(amountPaid) || amountPaid <= 0 || !selectedTrainer) {
                return displayMessage("لطفا تمام فیلدها را به درستی پر کنید.", true);
            }
            
            // Calculate 30 days period end date (using Gregorian date object for math)
            const dateObj = new Date(paymentDate + 'T00:00:00'); // Use ISO string with time to avoid timezone issues
            dateObj.setDate(dateObj.getDate() + 30);
            const periodEnd = dateObj.toISOString().substring(0, 10); // YYYY-MM-DD

            const newPayment = {
                memberName: memberName,
                amountPaid: amountPaid,
                paymentDate: paymentDate, // Gregorian for storage
                trainerId: trainerId,
                trainerName: selectedTrainer.name,
                trainerCommissionPercent: selectedTrainer.commissionPercent,
                periodStart: paymentDate, // Gregorian for storage
                periodEnd: periodEnd,     // Gregorian for storage
                timestamp: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, getCollectionPath(paymentsKey)), newPayment);
                form.reset();
                document.getElementById('payment-date').value = getCurrentGregorianDate(); // Reset date field manually
                displayMessage(`پرداختی "${memberName}" برای مربی ${selectedTrainer.name} ثبت شد. (پایان دوره: ${periodEnd})`);

                console.error("Error adding payment: ", e);

        async function handlePayrollReport(event) {
            event.preventDefault();
            const form = event.target;
            const paymentsKey = form.dataset.key;
            const payments = paymentsKey === 'payments_men' ? paymentsMen : paymentsWomen;
            
            const reportYear = parseInt(document.getElementById('report-year').value);
            const reportMonth = parseInt(document.getElementById('report-month').value);
            const payrollSummaryDiv = document.getElementById('payroll-summary');
            
            payrollSummaryDiv.innerHTML = 'در حال محاسبه...';

            if (isNaN(reportYear) || isNaN(reportMonth) || reportMonth < 1 || reportMonth > 12) {
                 payrollSummaryDiv.innerHTML = '<p class="text-red-500">لطفاً سال و ماه میلادی معتبری وارد کنید.</p>';
                return;
            }
            
            // Pad month with leading zero (e.g., 9 -> 09)
            const monthString = String(reportMonth).padStart(2, '0');

            // Filter payments based on Gregorian Month and Year
            const monthlyPayments = payments.filter(p => {
                // p.paymentDate is YYYY-MM-DD. Check if it starts with YYYY-MM
                return p.paymentDate.startsWith(`${reportYear}-${monthString}`);
            });

            if (monthlyPayments.length === 0) {
                payrollSummaryDiv.innerHTML = `<p class="text-gray-500 mt-4">هیچ پرداختی در ماه ${monthString}/${reportYear} یافت نشد.</p>`;
                return;
            }

            // Group payments by trainer
            const trainerPayroll = {};

            monthlyPayments.forEach(p => {
                // Use the stored commission percentage in the payment record for accuracy
                const commissionPercent = p.trainerCommissionPercent; 
                const trainerId = p.trainerId;
                const trainerName = p.trainerName;
                
                if (!trainerPayroll[trainerId]) {
                    trainerPayroll[trainerId] = {
                        name: trainerName,
                        totalReceived: 0,
                        commissionPercent: commissionPercent,
                        totalCommission: 0,
                        paymentCount: 0
                    };
                }
                
                const commissionAmount = p.amountPaid * (commissionPercent / 100);

                trainerPayroll[trainerId].totalReceived += p.amountPaid;
                trainerPayroll[trainerId].totalCommission += commissionAmount;
                trainerPayroll[trainerId].paymentCount++;
            });
            
            const trainerList = Object.values(trainerPayroll);

            let totalPayout = trainerList.reduce((sum, t) => sum + t.totalCommission, 0);

            // Render Payroll Report
            const reportHTML = `
                <h3 class="text-xl font-bold text-gray-800 pt-4">خلاصه حقوق مربیان - ماه ${monthString}/${reportYear}</h3>
                <div class="bg-blue-100 p-3 rounded-lg text-center font-bold my-4">
                    مجموع کل حق کمیسیون مربیان: <span class="text-2xl text-blue-800">${formatCurrency(totalPayout)}</span>
                </div>
                
                <div class="overflow-x-auto mt-4">
                    <table class="min-w-full bg-white rounded-lg shadow-md">
                        <thead class="bg-blue-500 text-white">
                            <tr>
                                <th class="py-3 px-4 text-right">نام مربی</th>
                                <th class="py-3 px-4 text-right">کمیسیون (%)</th>
                                <th class="py-3 px-4 text-right">کل پرداختی اعضا (تومان)</th>
                                <th class="py-3 px-4 text-right">حق کمیسیون نهایی</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${trainerList.map(t => `
                                <tr class="border-b hover:bg-gray-50">
                                    <td class="py-3 px-4 font-semibold">${t.name}</td>
                                    <td class="py-3 px-4">${t.commissionPercent}%</td>
                                    <td class="py-3 px-4">${formatCurrency(t.totalReceived)}</td>
                                    <td class="py-3 px-4 font-bold text-emerald-600">${formatCurrency(t.totalCommission)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            payrollSummaryDiv.innerHTML = reportHTML;
        }

        // --- Event Listeners for Tab Switching ---

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.tab-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    switchTab(e.target.dataset.tab);
                });
            });
            // Start the application lifecycle
            initFirebase();
        });
        
    </script>
</body>
</html>
